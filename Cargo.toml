# Espace de travail Cargo : un seul Cargo.lock et une seule version pour tous les paquets.
# https://doc.rust-lang.org/stable/book/ch14-03-cargo-workspaces.html
#
# Le paquet racine `spacejo-api` contient les fonctions Vercel : la documentation du runtime
# Rust demande un Cargo.toml à la racine et une entrée [[bin]] par fichier de `api/`.
[workspace]
members = ["crates/spacejo-core"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"

[package]
name = "spacejo-api"
description = "API HTTP de SpaceJo (fonctions Vercel) et stockage PostgreSQL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "dev_server"

[dependencies]
spacejo-core = { path = "crates/spacejo-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Runtime Rust de Vercel (bêta) : https://vercel.com/docs/functions/runtimes/rust
vercel_runtime = "2.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
# Lecture du corps des requêtes avec une taille maximale (déjà tirée par vercel_runtime).
http-body-util = "0.1.5"
# PostgreSQL : pas de fonctionnalités par défaut ; `macros` sert uniquement à `sqlx::migrate!`.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "migrate", "macros", "json"] }
# Entropie du système pour les jetons, les codes de partie et les graines.
getrandom = "0.4.3"
# Hachage des jetons (seul le hachage est stocké).
sha2 = "0.11.1"

# Une entrée par fonction Vercel (noms uniques).
[[bin]]
name = "create"
path = "api/create.rs"

[[bin]]
name = "join"
path = "api/join.rs"

[[bin]]
name = "rules"
path = "api/rules.rs"

[[bin]]
name = "start"
path = "api/start.rs"

[[bin]]
name = "action"
path = "api/action.rs"

[[bin]]
name = "skip"
path = "api/skip.rs"

[[bin]]
name = "state"
path = "api/state.rs"

# Outils de développement (hors Vercel) : serveur local et migrations.
[[bin]]
name = "dev_server"
path = "src/bin/dev_server.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

# Réglages de compilation recommandés par la documentation Vercel.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
