# Espace de travail Cargo : un seul Cargo.lock et une seule version pour tous les paquets.
# https://doc.rust-lang.org/stable/book/ch14-03-cargo-workspaces.html
#
# Le paquet racine `spacejo-api` contient l'API, le serveur HTTP et le stockage ; la logique du jeu est
# dans `crates/spacejo-core`.
[workspace]
members = ["crates/spacejo-core"]
resolver = "3"

[workspace.package]
version = "1.6.0"
edition = "2024"
rust-version = "1.94"

[package]
name = "spacejo-api"
description = "API HTTP de SpaceJo, serveur (axum) et stockage PostgreSQL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "server"

[dependencies]
spacejo-core = { path = "crates/spacejo-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "net", "fs", "signal"] }
# PostgreSQL : pas de fonctionnalités par défaut ; `macros` sert uniquement à `sqlx::migrate!`.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "migrate", "macros", "json"] }
# Entropie du système pour les jetons, les codes de partie et les graines.
getrandom = "0.4.3"
# Hachage des jetons (seul le hachage est stocké).
sha2 = "0.11.1"
# Serveur HTTP (routes, extraction des requêtes), de l'écosystème tokio.
axum = "0.8.9"
# Fichiers de l'interface (avec leur version gzip préparée au build) et compression des réponses de l'API.
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip"] }
# Pour appeler ces services depuis une route axum (`ServiceExt::oneshot`) ; aussi utilisé par les tests.
tower = { version = "0.5.3", features = ["util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

# Le serveur (API et interface) et l'outil de migration.
[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

# Compilation pour la production : optimisée, mais sans `lto = "fat"` ni `codegen-units = 1`, qui feraient
# l'édition des liens sur un seul cœur (build bien plus long pour un gain imperceptible : le serveur passe
# son temps à attendre la base de données).
[profile.release]
opt-level = 3
lto = false
codegen-units = 16

